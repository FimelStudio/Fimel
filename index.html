<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/brand/fimel-logo.png" />
    <link rel="preload" href="%BASE_URL%assets/fonts/minecraft-seven/minecraft-seven-latin.woff" as="font" type="font/woff" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the saved theme before the app and styles paint to avoid a light flash.
      (() => {
        let savedTheme;
        try { savedTheme = localStorage.getItem('fimel_theme'); } catch { /* Storage may be disabled. */ }
        const isDark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
    <title>Fimel Studio</title>
    <meta name="description" content="Fimel 制作 Minecraft 地图、模组和创作工具。在这里查看作品、下载已发布项目，或联系工作室。" />

    <meta name="author" content="Fimel Studio" />
    <meta name="theme-color" content="#0a0a0a" />
